name: CD - Build & Push to GHCR

on:
  push:
    branches: ["main", "feature"]
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set tag and image base (lowercase)
        id: meta
        shell: bash
        run: |
          # tag: latest for branch pushes, or git tag for releases
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          # repo in lowercase for GHCR/docker
          IMAGE_BASE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/web:${{ steps.meta.outputs.tag }}

      - name: Build & Push CELERY
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/celery:${{ steps.meta.outputs.tag }}

      - name: Build & Push CELERY-BEAT
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/celery-beat:${{ steps.meta.outputs.tag }}