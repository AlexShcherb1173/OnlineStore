name: CI/CD

on:
  push:
    branches: ["main", "feature"]
  pull_request:
    branches: ["main", "feature"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov model-bakery

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=75

  build_push:
    runs-on: ubuntu-latest
    needs: [tests]
    # build+push только на push в main (не на PR)
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Prepare image names (lowercase)
        id: meta
        shell: bash
        run: |
          IMAGE_BASE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT
          echo "WEB=${{ env.REGISTRY }}/$IMAGE_BASE/web:latest" >> $GITHUB_OUTPUT
          echo "CELERY=${{ env.REGISTRY }}/$IMAGE_BASE/celery:latest" >> $GITHUB_OUTPUT
          echo "BEAT=${{ env.REGISTRY }}/$IMAGE_BASE/celery-beat:latest" >> $GITHUB_OUTPUT
          echo "Using tags:"
          echo "${{ env.REGISTRY }}/$IMAGE_BASE/web:latest"
          echo "${{ env.REGISTRY }}/$IMAGE_BASE/celery:latest"
          echo "${{ env.REGISTRY }}/$IMAGE_BASE/celery-beat:latest"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.WEB }}

      - name: Build & push CELERY
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.CELERY }}

      - name: Build & push CELERY BEAT
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.BEAT }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build_push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            sudo mkdir -p /opt/onlinestore
            sudo chown -R $USER:$USER /opt/onlinestore
            cd /opt/onlinestore

            # тут должен быть docker-compose.prod.yml (можно держать в репо и копировать, либо заранее положить на сервер)
            ls -la

            # если образы приватные — делаем login (опционально)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.SSH_USER }}" --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps