name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov model-bakery

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings_test
        run: |
          pytest --cov --cov-report=term-missing --cov-fail-under=75

  build_and_push:
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Compute image base (lowercase)
        id: meta
        shell: bash
        run: |
          IMAGE_BASE="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_base=$IMAGE_BASE" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push WEB
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/web:latest

      - name: Build & Push CELERY
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/celery:latest

      - name: Build & Push CELERY-BEAT
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_base }}/celery-beat:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build_and_push]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            sudo mkdir -p /opt/onlinestore/docker/nginx
            sudo chown -R $USER:$USER /opt/onlinestore
            cd /opt/onlinestore

            # (опционально) GHCR login, если образы приватные
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.SSH_USER }}" --password-stdin || true
            fi

            # гарантируем .env (можно хранить на сервере один раз — но витринно пусть workflow поддерживает)
            if [ ! -f .env ]; then
              cat > .env << 'EOF'
DJANGO_SETTINGS_MODULE=config.settings
DEBUG=0
ALLOWED_HOSTS=*
SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}

POSTGRES_DB=onlinestore
POSTGRES_USER=onlinestore
POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
POSTGRES_HOST=db
POSTGRES_PORT=5432

REDIS_HOST=redis
REDIS_PORT=6379

CACHE_ENABLED=1
CACHE_TTL=300
EOF
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml ps